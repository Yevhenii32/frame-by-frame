
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frame by Frame - HardwareVision</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="sidebar">
        <div class="logo">
            <span style="color: #3b82f6;">O</span> Frame by Frame
        </div>

        <div class="menu-category">Компоненти</div>

        <div class="menu-item">Центральний процесор (CPU)</div>
        <div class="menu-item">Система охолодження</div>
        <div class="menu-item">Відеокарта (GPU)</div>
        <div class="menu-item">Оперативна пам'ять (RAM)</div>
        <div class="menu-item">Накопичувачі (SSD/HDD)</div>
    </div>

    <div class="main-content">
        <div class="header">
            <h2>Інтерактивна карта материнської плати</h2>
            <div class="audio-toggle">🔊 Звук: Увімк.</div>
        </div>

        <div class="motherboard-container">

            <!-- CPU -->
            <a href="cpu.html"
               class="interactive-zone slot-cpu"
               style="text-decoration: none;">
                <span class="tooltip">CPU: Анімована еволюція (Клікніть)</span>
            </a>

            <!-- SSD -->
            <div class="interactive-zone slot-storage">
                <span class="tooltip">Накопичувач SSD</span>
            </div>

            <!-- GPU -->
            <div class="interactive-zone slot-gpu">
                <span class="tooltip">Відеокарта GPU</span>
            </div>

            <!-- RAM -->
            <div class="interactive-zone slot-other">
                <span class="tooltip">Оперативна пам'ять RAM</span>
            </div>

        </div>
    </div>

</body>
</html>
